<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>og-cover Quelle – VoltDetective (1200 × 630)</title>
<!--
  Quelldatei für og-cover.png. Gleiches Verfahren wie news/source/cover_*.html:
  Im Browser öffnen, Fenster auf 1200 × 630 stellen, als PNG aufnehmen und als
  og-cover.png im Repo-Wurzelverzeichnis ablegen. Danach in allen Seiten
  icon-512.png gegen og-cover.png tauschen und twitter:card auf
  summary_large_image setzen.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Barlow', sans-serif;
    background: #0d1b2e;
  }

  .cover {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 60% at 78% 12%, rgba(0,198,255,.16) 0%, transparent 62%),
      linear-gradient(160deg, #14293f 0%, #0d1b2e 55%, #0a1626 100%);
    padding: 62px 70px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Feines Raster wie im Design-System */
  .cover::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,198,255,.035) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,198,255,.035) 40px);
  }

  /* Große, transparente Ziffer als Wasserzeichen */
  .watermark {
    position: absolute; right: -30px; top: 44px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 400px; line-height: .8; letter-spacing: -.03em;
    color: rgba(0,198,255,.055); user-select: none;
  }

  .top, .mid, .bottom { position: relative; z-index: 1; }

  /* Wortmarke */
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 58px; height: 58px; border-radius: 15px; flex-shrink: 0;
    background: rgba(0,198,255,.12); border: 1px solid rgba(0,198,255,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 27px; height: 27px; }
  .wordmark {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 37px; letter-spacing: .055em; color: #f0f4ff; line-height: 1;
  }
  .wordmark span { color: #00c6ff; }

  /* Schlagzeile */
  .headline {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 96px; line-height: .93; letter-spacing: .005em;
    color: #f0f4ff; text-transform: uppercase; margin-bottom: 22px;
  }
  .headline em { font-style: normal; color: #00c6ff; }

  .sub { font-size: 25px; color: #9fb6cc; font-weight: 400; max-width: 760px; line-height: 1.4; }

  /* Fußzeile */
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .pills { display: flex; gap: 12px; flex-wrap: wrap; }
  .pill {
    font-size: 19px; font-weight: 500; color: #cfe2f2;
    background: rgba(0,198,255,.07); border: 1px solid rgba(0,198,255,.3);
    border-radius: 22px; padding: 9px 21px; white-space: nowrap;
  }
  .domain {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 25px; letter-spacing: .02em; color: #00c6ff;
  }
  .domain svg { width: 21px; height: 21px; }
</style>
</head>
<body>
  <div class="cover">
    <div class="watermark">4</div>

    <div class="top">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#00c6ff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#00c6ff" fill-opacity=".18"/>
          </svg>
        </div>
        <div class="wordmark">VOLT<span>DETECTIVE</span></div>
      </div>
    </div>

    <div class="mid">
      <div class="headline"><em>4 Modi</em><br>Elektro-Training</div>
      <div class="sub">Interaktive Lernspiele mit echter Stromkreis-Simulation</div>
    </div>

    <div class="bottom">
      <div class="pills">
        <span class="pill">Werkstatt</span>
        <span class="pill">Lampen-Fehlersuche</span>
        <span class="pill">Messprotokoll</span>
        <span class="pill">Installation</span>
      </div>
      <div class="domain">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00c6ff" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        spiel.elektrogenius.de
      </div>
    </div>
  </div>
</body>
</html>
